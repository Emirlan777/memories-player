<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071416">
  <meta name="description" content="memories — leadwave">
  <title>memories — leadwave</title>

  <style>
    :root {
      --bg: #071416;
      --text: #f4fbfa;
      --muted: rgba(244, 251, 250, .62);
      --line: rgba(255,255,255,.11);
      --glass: rgba(9, 25, 27, .64);
      --accent: #9be8dc;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .background {
      position: fixed;
      inset: -12%;
      z-index: 0;
      background:
        radial-gradient(circle at 18% 15%, rgba(76, 180, 168, .28), transparent 34%),
        radial-gradient(circle at 84% 78%, rgba(32, 108, 105, .24), transparent 38%),
        linear-gradient(145deg, #08191b 0%, #061012 55%, #071a1a 100%);
      filter: blur(0px);
    }

    .background::before,
    .background::after {
      content: "";
      position: absolute;
      width: 48vw;
      height: 48vw;
      min-width: 280px;
      min-height: 280px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .42;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .background::before {
      left: -8%;
      top: 4%;
      background: rgba(86, 205, 191, .26);
    }

    .background::after {
      right: -10%;
      bottom: -4%;
      background: rgba(33, 111, 112, .24);
      animation-delay: -5s;
    }

    @keyframes drift {
      from { transform: translate3d(-10px, 8px, 0) scale(1); }
      to { transform: translate3d(18px, -16px, 0) scale(1.08); }
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 18px;
      background: linear-gradient(145deg, rgba(20, 44, 46, .76), rgba(5, 18, 20, .78));
      box-shadow: 0 30px 80px rgba(0,0,0,.48);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, rgba(255,255,255,.08), transparent 28%, transparent 72%, rgba(155,232,220,.04));
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 15px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(155,232,220,.7);
    }

    .art {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 20px;
      overflow: hidden;
      background:
        radial-gradient(circle at 32% 24%, rgba(172, 247, 235, .25), transparent 20%),
        radial-gradient(circle at 70% 70%, rgba(71, 164, 157, .36), transparent 34%),
        linear-gradient(145deg, #426c6c, #122b2d 55%, #081718);
      box-shadow: inset 0 0 70px rgba(0,0,0,.28);
    }

    /* Abstract water-like texture, so the page does not depend on a separate image file. */
    .art::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        repeating-radial-gradient(
          ellipse at 48% 48%,
          transparent 0 14px,
          rgba(207, 248, 241, .055) 16px 19px,
          transparent 22px 37px
        );
      transform: rotate(-10deg) scale(1.2);
      filter: blur(2px);
      opacity: .8;
      animation: water 13s linear infinite;
    }

    .art::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(110deg, transparent 12%, rgba(206,250,244,.12) 35%, transparent 53%),
        radial-gradient(circle at 50% 48%, transparent 0 28%, rgba(0,0,0,.2) 72%);
      mix-blend-mode: screen;
      opacity: .7;
    }

    @keyframes water {
      from { transform: rotate(-10deg) translate3d(-2%, 0, 0) scale(1.2); }
      to { transform: rotate(-10deg) translate3d(2%, -2%, 0) scale(1.2); }
    }

    .art-label {
      position: absolute;
      left: 22px;
      bottom: 20px;
      z-index: 2;
      font-size: clamp(30px, 9vw, 52px);
      font-weight: 300;
      letter-spacing: -.045em;
      text-shadow: 0 3px 24px rgba(0,0,0,.5);
    }

    .info {
      padding: 22px 4px 18px;
    }

    .title {
      margin: 0;
      font-size: 30px;
      line-height: 1;
      letter-spacing: -.035em;
      font-weight: 650;
    }

    .artist {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .quote {
      margin: 18px 0 0;
      color: rgba(244,251,250,.46);
      font-size: 13px;
      font-style: italic;
    }

    .player {
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.18);
    }

    #embed-iframe {
      width: 100%;
      min-height: 152px;
    }

    .fallback {
      display: none;
      padding: 18px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .fallback a {
      color: var(--text);
      text-decoration: none;
      font-weight: 650;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 4px 1px;
      color: rgba(244,251,250,.35);
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    @media (max-width: 420px) {
      body { padding: 12px; }
      .card { border-radius: 23px; padding: 13px; }
      .art { border-radius: 17px; }
      .info { padding-top: 18px; }
    }
  </style>
</head>

<body>
  <div class="background" aria-hidden="true"></div>

  <main class="shell">
    <section class="card">
      <div class="top">
        <div class="eyebrow">now playing</div>
        <div class="dot" aria-hidden="true"></div>
      </div>

      <div class="art" role="img" aria-label="Атмосферная обложка memories">
        <div class="art-label">memories</div>
      </div>

      <div class="info">
        <h1 class="title">memories</h1>
        <div class="artist">leadwave</div>
        <p class="quote">some memories never fade.</p>
      </div>

      <div class="player">
        <div id="embed-iframe"></div>
        <div class="fallback" id="fallback">
          Spotify не загрузился. <a href="https://open.spotify.com/track/4VkRQSpG16JxrXaVlNyWdX" target="_blank" rel="noopener">Открыть трек в Spotify</a>
        </div>
      </div>

      <div class="footer">
        <span>memories · 2022</span>
        <a href="https://open.spotify.com/track/4VkRQSpG16JxrXaVlNyWdX" target="_blank" rel="noopener">spotify</a>
      </div>
    </section>
  </main>

  <script>
    let spotifyController = null;

    window.onSpotifyIframeApiReady = (IFrameAPI) => {
      const element = document.getElementById('embed-iframe');

      const options = {
        width: '100%',
        height: 152,
        uri: 'spotify:track:4VkRQSpG16JxrXaVlNyWdX'
      };

      IFrameAPI.createController(element, options, (EmbedController) => {
        spotifyController = EmbedController;

        EmbedController.addListener('ready', () => {
          document.getElementById('fallback').style.display = 'none';
        });

        EmbedController.addListener('playback_started', () => {
          document.title = '▶ memories — leadwave';
        });

        EmbedController.addListener('playback_update', (event) => {
          if (event && event.data && event.data.isPaused) {
            document.title = 'memories — leadwave';
          }
        });
      });
    };

    setTimeout(() => {
      const iframe = document.querySelector('#embed-iframe iframe');
      if (!iframe) {
        document.getElementById('fallback').style.display = 'block';
      }
    }, 8000);
  </script>

  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
